AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Routebox network stack. VPC + public/private subnets across 3 AZs, IGW,
  single NAT gateway, route tables, default security groups. Deployed three
  times (dev/staging/prod) — same template, different params, same account.

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Which environment this stack instance is for. Drives tags + export names.

  VpcCidr:
    Type: String
    Description: CIDR block for the VPC. /16 in practice.
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$

  PublicSubnet1Cidr:
    Type: String
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
  PublicSubnet2Cidr:
    Type: String
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
  PublicSubnet3Cidr:
    Type: String
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$

  PrivateSubnet1Cidr:
    Type: String
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
  PrivateSubnet2Cidr:
    Type: String
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
  PrivateSubnet3Cidr:
    Type: String
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$

  CostCenter:
    Type: String
    Default: platform
    Description: Tag value applied to billable resources.

Resources:

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub routebox-${EnvironmentName}-vpc
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: cloudformation
        - Key: CostCenter
          Value: !Ref CostCenter

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub routebox-${EnvironmentName}-igw
        - Key: Environment
          Value: !Ref EnvironmentName

  IgwAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub routebox-${EnvironmentName}-public-a
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Tier
          Value: public

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub routebox-${EnvironmentName}-public-b
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Tier
          Value: public

  PublicSubnet3:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnet3Cidr
      AvailabilityZone: !Select [2, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub routebox-${EnvironmentName}-public-c
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Tier
          Value: public

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub routebox-${EnvironmentName}-private-a
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Tier
          Value: private

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub routebox-${EnvironmentName}-private-b
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Tier
          Value: private

  PrivateSubnet3:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnet3Cidr
      AvailabilityZone: !Select [2, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub routebox-${EnvironmentName}-private-c
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Tier
          Value: private

  # Single NAT gateway. Cheap, but a SPOF. Originally there were three (one per AZ);
  # we collapsed to one a while back and never put the others back.
  NatEip:
    Type: AWS::EC2::EIP
    DependsOn: IgwAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub routebox-${EnvironmentName}-nat-eip

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub routebox-${EnvironmentName}-nat
        - Key: Environment
          Value: !Ref EnvironmentName

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub routebox-${EnvironmentName}-public-rt
        - Key: Environment
          Value: !Ref EnvironmentName

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet3Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet3
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub routebox-${EnvironmentName}-private-rt
        - Key: Environment
          Value: !Ref EnvironmentName

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnet1Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet3Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet3
      RouteTableId: !Ref PrivateRouteTable

  # Default SGs that other stacks reference via cross-stack imports.
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Routebox public ALB. Open 80/443 from the internet.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP from the internet (redirected to HTTPS at the listener)
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS from the internet
      Tags:
        - Key: Name
          Value: !Sub routebox-${EnvironmentName}-alb-sg
        - Key: Environment
          Value: !Ref EnvironmentName

  EcsServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Routebox ECS service tasks. Inbound from the ALB only.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 0
          ToPort: 65535
          SourceSecurityGroupId: !Ref AlbSecurityGroup
          Description: All ports from ALB. Tightened per-service in the task SG would be better.
      Tags:
        - Key: Name
          Value: !Sub routebox-${EnvironmentName}-ecs-sg
        - Key: Environment
          Value: !Ref EnvironmentName

  RdsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Routebox RDS Postgres. 5432 from ECS tasks and Jenkins.
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub routebox-${EnvironmentName}-rds-sg
        - Key: Environment
          Value: !Ref EnvironmentName

  RdsIngressFromEcs:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RdsSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref EcsServiceSecurityGroup
      Description: Postgres from ECS tasks

  JenkinsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Jenkins EC2. 8080 from VPC, 22 from bastion CIDR (TODO).
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: !Ref VpcCidr
          Description: Jenkins UI inside the VPC
      Tags:
        - Key: Name
          Value: !Sub routebox-${EnvironmentName}-jenkins-sg
        - Key: Environment
          Value: !Ref EnvironmentName

  # Allow Jenkins to reach RDS (it runs migrations and the rotate-keys job hits the API).
  RdsIngressFromJenkins:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RdsSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref JenkinsSecurityGroup
      Description: Postgres from Jenkins (migrations + ad-hoc)

Outputs:

  VpcId:
    Description: VPC ID
    Value: !Ref Vpc
    Export:
      Name: !Sub routebox-${EnvironmentName}-vpc-id

  VpcCidrBlock:
    Description: VPC CIDR block
    Value: !GetAtt Vpc.CidrBlock
    Export:
      Name: !Sub routebox-${EnvironmentName}-vpc-cidr

  PublicSubnet1Id:
    Value: !Ref PublicSubnet1
    Export:
      Name: !Sub routebox-${EnvironmentName}-public-subnet-1
  PublicSubnet2Id:
    Value: !Ref PublicSubnet2
    Export:
      Name: !Sub routebox-${EnvironmentName}-public-subnet-2
  PublicSubnet3Id:
    Value: !Ref PublicSubnet3
    Export:
      Name: !Sub routebox-${EnvironmentName}-public-subnet-3

  PrivateSubnet1Id:
    Value: !Ref PrivateSubnet1
    Export:
      Name: !Sub routebox-${EnvironmentName}-private-subnet-1
  PrivateSubnet2Id:
    Value: !Ref PrivateSubnet2
    Export:
      Name: !Sub routebox-${EnvironmentName}-private-subnet-2
  PrivateSubnet3Id:
    Value: !Ref PrivateSubnet3
    Export:
      Name: !Sub routebox-${EnvironmentName}-private-subnet-3

  # Older grandfathered exports. Don't rename — rds and ecs-cluster import these names
  # in places that are awkward to change without a coordinated multi-stack update.
  PrivateSubnetAGrandfathered:
    Description: Legacy export name. Predates the routebox-<env>-<resource> convention.
    Value: !Ref PrivateSubnet1
    Export:
      Name: !Sub ${EnvironmentName}-subnet-private-a
  VpcIdGrandfathered:
    Description: Legacy export name. Predates the convention. Don't rename.
    Value: !Ref Vpc
    Export:
      Name: !Sub ${EnvironmentName}-vpc

  AlbSecurityGroupId:
    Value: !Ref AlbSecurityGroup
    Export:
      Name: !Sub routebox-${EnvironmentName}-alb-sg-id

  EcsServiceSecurityGroupId:
    Value: !Ref EcsServiceSecurityGroup
    Export:
      Name: !Sub routebox-${EnvironmentName}-ecs-sg-id

  RdsSecurityGroupId:
    Value: !Ref RdsSecurityGroup
    Export:
      Name: !Sub routebox-${EnvironmentName}-rds-sg-id

  JenkinsSecurityGroupId:
    Value: !Ref JenkinsSecurityGroup
    Export:
      Name: !Sub routebox-${EnvironmentName}-jenkins-sg-id

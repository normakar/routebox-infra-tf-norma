name: Terraform Deploy
on:
  push:

  # # Allows you to run this workflow manually from the Actions tab
  # workflow_dispatch:
  
permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout

jobs:
  infra-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./environments/dev/

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.6"

      - name: AWS Login
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::834786370659:role/gha-routebox-infra-tf-dev
          role-session-name: gha-session

      - name: Init Terraform
        run: |
          terraform init   

      - name: Plan Terraform
        run: |
          terraform plan -var-file=dev.tfvars -input=false

      - name: Apply Terraform
        run: |
          terraform apply -var-file=dev.tfvars -input=false -auto-approve          

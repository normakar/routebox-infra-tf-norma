name: CI
on:
  push:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.6"

      - name: AWS Login
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::834786370659:role/gha-routebox-infra-tf-dev
          role-session-name: gha-session

      - name: Run a multi-line script
        run: |
          cd environments/dev/
          terraform init
          terraform plan -var-file=dev.tfvars -input=false
          terraform apply -var-file=dev.tfvars -input=false -auto-approve          
